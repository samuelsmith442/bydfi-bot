<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Trading Dashboard - BYDFi Bot</title>
    <link rel="stylesheet" href="/public/styles.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card { background: rgba(30,41,59,0.5); border: 1px solid rgba(148,163,184,0.1); border-radius: 8px; padding: 1rem; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.4rem; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: #f1f5f9; }
        .stat-value.positive { color: #10b981; }
        .stat-value.negative { color: #ef4444; }

        .trade-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .trade-form input, .trade-form select {
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 6px;
            color: #f1f5f9;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            width: 100%;
            box-sizing: border-box;
        }
        .trade-form input::placeholder { color: #64748b; }
        .trade-form input:focus, .trade-form select:focus { outline: none; border-color: #60a5fa; }
        .trade-form select option { background: #1e293b; }
        .form-full { grid-column: 1 / -1; }
        .btn { padding: 0.55rem 1.25rem; border-radius: 6px; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
        .btn:hover { opacity: 0.85; }
        .btn-long  { background: #10b981; color: #fff; }
        .btn-short { background: #ef4444; color: #fff; }
        .btn-close { background: rgba(148,163,184,0.12); color: #94a3b8; font-size: 0.75rem; padding: 0.3rem 0.65rem; border-radius: 4px; cursor: pointer; border: none; }
        .btn-close:hover { background: rgba(239,68,68,0.2); color: #ef4444; }
        .form-msg { font-size: 0.8rem; margin-top: 0.5rem; min-height: 1.2rem; }
        .form-msg.ok  { color: #10b981; }
        .form-msg.err { color: #ef4444; }

        .position-card { background: rgba(30,41,59,0.5); border: 1px solid rgba(148,163,184,0.1); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .position-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
        .position-symbol { font-size: 1.1rem; font-weight: bold; color: #f1f5f9; }
        .badges { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
        .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge.long   { background: rgba(16,185,129,0.2); color: #10b981; }
        .badge.short  { background: rgba(239,68,68,0.2);  color: #ef4444; }
        .badge.manual { background: rgba(96,165,250,0.2);  color: #60a5fa; }
        .badge.bot    { background: rgba(168,85,247,0.2);  color: #a855f7; }
        .position-details { display: grid; grid-template-columns: repeat(2,1fr); gap: 0.4rem; font-size: 0.85rem; color: #94a3b8; }
        .position-pnl { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(148,163,184,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .trade-card { background: rgba(30,41,59,0.5); border: 1px solid rgba(148,163,184,0.1); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
        .trade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
        .trade-result { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .trade-result.win  { background: rgba(16,185,129,0.2); color: #10b981; }
        .trade-result.loss { background: rgba(239,68,68,0.2);  color: #ef4444; }
        .notes-text { font-size: 0.8rem; color: #60a5fa; margin-top: 0.4rem; font-style: italic; }
        .nav-links a { color: #60a5fa; text-decoration: none; margin-right: 1rem; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Paper Trading Dashboard</h1>
            <div class="nav-links"><a href="/">← Back to Signals</a></div>
        </header>

        <!-- Account stats -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Balance</div><div class="stat-value" id="balance">$0.00</div></div>
            <div class="stat-card"><div class="stat-label">Equity</div><div class="stat-value" id="equity">$0.00</div></div>
            <div class="stat-card"><div class="stat-label">Total P&L</div><div class="stat-value" id="total-pnl">$0.00</div></div>
            <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value" id="win-rate">0%</div></div>
            <div class="stat-card"><div class="stat-label">Total Trades</div><div class="stat-value" id="total-trades">0</div></div>
            <div class="stat-card"><div class="stat-label">Profit Factor</div><div class="stat-value" id="profit-factor">0.00</div></div>
        </div>

        <!-- Manual trade entry -->
        <div class="card">
            <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>✏️ Manual Trade Entry</span>
                <button class="btn" style="background:rgba(239,68,68,0.15);color:#ef4444;font-size:0.75rem;padding:0.3rem 0.8rem;" onclick="resetAccount()">🔄 Reset Account</button>
            </div>
            <div class="trade-form">
                <input id="f-symbol"  type="text"   placeholder="Symbol  e.g. BTC-USDT" onblur="lookupPrice()" />
                <select id="f-side">
                    <option value="SHORT">SHORT (Sell / Bear)</option>
                    <option value="LONG">LONG (Buy / Bull)</option>
                </select>
                <div style="position:relative;">
                    <input id="f-entry" type="number" step="any" placeholder="Entry Price" style="width:100%;box-sizing:border-box;" />
                    <div id="f-price-hint" style="font-size:0.72rem;color:#60a5fa;margin-top:0.2rem;"></div>
                </div>
                <input id="f-sl"    type="number" step="any" placeholder="Stop Loss" />
                <input id="f-tp"    type="number" step="any" placeholder="Take Profit (optional)" />
                <input id="f-notes" type="text"   placeholder="Notes (optional)" class="form-full" />
            </div>
            <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                <button class="btn btn-short" onclick="submitTrade('SHORT', false)">📉 Open SHORT</button>
                <button class="btn btn-long"  onclick="submitTrade('LONG', false)">📈 Open LONG</button>
            </div>
            <div class="form-msg" id="form-msg"></div>
        </div>

        <!-- Open positions -->
        <div class="card">
            <div class="card-title">📊 Open Positions</div>
            <div id="open-positions"><div class="no-data">No open positions</div></div>
        </div>

        <!-- Trade history -->
        <div class="card">
            <div class="card-title">📈 Recent Trades (Last 20)</div>
            <div id="recent-trades"><div class="no-data">No trades yet</div></div>
        </div>

        <div class="last-update">Auto-refreshes every 5 seconds.</div>
    </div>

    <script>
        function fmt$(v)   { return '$' + Number(v).toFixed(4); }
        function fmt$2(v)  { return '$' + Number(v).toFixed(2); }
        function fmtPct(v) { return Number(v).toFixed(2) + '%'; }
        function fmtDur(ms) {
            const m = Math.floor(ms / 60000);
            if (m < 60) return m + 'min';
            return Math.floor(m / 60) + 'h ' + (m % 60) + 'min';
        }

        function renderStats(d) {
            document.getElementById('balance').textContent = fmt$2(d.balance);
            document.getElementById('equity').textContent  = fmt$2(d.equity);
            const el = document.getElementById('total-pnl');
            el.textContent = fmt$2(d.totalPnL) + ' (' + fmtPct(d.totalPnLPercent) + ')';
            el.className   = 'stat-value ' + (d.totalPnL >= 0 ? 'positive' : 'negative');
            document.getElementById('win-rate').textContent      = fmtPct(d.winRate);
            document.getElementById('total-trades').textContent  = d.totalTrades;
            document.getElementById('profit-factor').textContent = Number(d.profitFactor).toFixed(2);
        }

        function renderOpenPositions(positions) {
            const el = document.getElementById('open-positions');
            if (!positions.length) { el.innerHTML = '<div class="no-data">No open positions</div>'; return; }
            el.innerHTML = positions.map(p => {
                const pnlCls = p.unrealizedPnL >= 0 ? 'positive' : 'negative';
                const sideCls = p.side.toLowerCase();
                const srcCls  = (p.source || 'BOT').toLowerCase();
                const tp    = p.takeProfit ? `<div>Take Profit: ${fmt$(p.takeProfit)}</div>` : '';
                const notes = p.notes ? `<div class="notes-text">📝 ${p.notes}</div>` : '';
                return `
                <div class="position-card">
                    <div class="position-header">
                        <span class="position-symbol">${p.symbol}</span>
                        <div class="badges">
                            <span class="badge ${sideCls}">${p.side}</span>
                            <span class="badge ${srcCls}">${p.source || 'BOT'}</span>
                            <button class="btn-close" onclick="closePosition('${p.id}','${p.symbol}')">✕ Close</button>
                        </div>
                    </div>
                    <div class="position-details">
                        <div>Entry: ${fmt$(p.entryPrice)}</div>
                        <div>Current: ${fmt$(p.currentPrice)}</div>
                        <div>Size: ${fmt$2(p.positionSize)}</div>
                        <div>Leverage: ${p.leverage}x</div>
                        <div>Stop Loss: ${fmt$(p.stopLoss)}</div>
                        <div>Qty: ${Number(p.quantity).toFixed(4)}</div>
                        ${tp}
                    </div>
                    ${notes}
                    <div class="position-pnl">
                        <span style="color:#94a3b8;">Unrealized P&L</span>
                        <span class="${pnlCls}" style="font-weight:bold;font-size:1.1rem;">
                            ${fmt$2(p.unrealizedPnL)} (${fmtPct(p.unrealizedPnLPercent)})
                        </span>
                    </div>
                </div>`;
            }).join('');
        }

        function renderRecentTrades(trades) {
            const el = document.getElementById('recent-trades');
            if (!trades.length) { el.innerHTML = '<div class="no-data">No trades yet</div>'; return; }
            el.innerHTML = trades.slice(-20).reverse().map(t => {
                const resCls  = t.realizedPnL >= 0 ? 'win' : 'loss';
                const resText = t.realizedPnL >= 0 ? '✅ WIN' : '❌ LOSS';
                const sideCls = t.side.toLowerCase();
                const srcCls  = (t.source || 'BOT').toLowerCase();
                const notes   = t.notes ? `<div class="notes-text">📝 ${t.notes}</div>` : '';
                return `
                <div class="trade-card">
                    <div class="trade-header">
                        <div class="badges">
                            <span class="position-symbol">${t.symbol}</span>
                            <span class="badge ${sideCls}">${t.side}</span>
                            <span class="badge ${srcCls}">${t.source || 'BOT'}</span>
                        </div>
                        <span class="trade-result ${resCls}">${resText}</span>
                    </div>
                    <div class="position-details">
                        <div>Entry: ${fmt$(t.entryPrice)}</div>
                        <div>Exit: ${fmt$(t.exitPrice)}</div>
                        <div>Size: ${fmt$2(t.positionSize)}</div>
                        <div>Duration: ${fmtDur(t.duration)}</div>
                        <div>Reason: ${t.closeReason}</div>
                        <div style="font-weight:bold;color:${t.realizedPnL>=0?'#10b981':'#ef4444'}">
                            P&L: ${fmt$2(t.realizedPnL)} (${fmtPct(t.realizedPnLPercent)})
                        </div>
                    </div>
                    ${notes}
                </div>`;
            }).join('');
        }

        async function fetchData() {
            try {
                const r = await fetch('/api/paper-trading');
                if (!r.ok) return;
                const d = await r.json();
                if (d.message) return;
                renderStats(d);
                renderOpenPositions(d.openPositions || []);
                renderRecentTrades(d.closedTrades || []);
            } catch(e) { console.error(e); }
        }

        function showMsg(text, isErr) {
            const el = document.getElementById('form-msg');
            el.textContent = text;
            el.className = 'form-msg ' + (isErr ? 'err' : 'ok');
            setTimeout(() => { el.textContent = ''; el.className = 'form-msg'; }, 5000);
        }

        async function lookupPrice() {
            const symbol = document.getElementById('f-symbol').value.trim().toUpperCase();
            if (!symbol) return;
            const hint = document.getElementById('f-price-hint');
            try {
                const r = await fetch('/api/price/' + symbol);
                if (!r.ok) { hint.textContent = ''; return; }
                const d = await r.json();
                hint.textContent = 'Live price: $' + Number(d.price).toFixed(6);
                // Auto-fill entry if blank
                const entryEl = document.getElementById('f-entry');
                if (!entryEl.value) entryEl.value = d.price;
            } catch(e) { hint.textContent = ''; }
        }

        async function submitTrade(forceSide, forceSubmit) {
            const symbol     = document.getElementById('f-symbol').value.trim().toUpperCase();
            const side       = forceSide;
            const entryPrice = document.getElementById('f-entry').value;
            const stopLoss   = document.getElementById('f-sl').value;
            const takeProfit = document.getElementById('f-tp').value;
            const notes      = document.getElementById('f-notes').value.trim();

            if (!symbol)     return showMsg('Symbol is required', true);
            if (!entryPrice) return showMsg('Entry price is required', true);
            if (!stopLoss)   return showMsg('Stop loss is required', true);

            const body = { symbol, side, entryPrice, stopLoss, forceSubmit: !!forceSubmit };
            if (takeProfit) body.takeProfit = takeProfit;
            if (notes)      body.notes = notes;

            try {
                const r = await fetch('/api/manual-trade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const d = await r.json();
                if (r.status === 409 && d.error === 'PRICE_WARNING') {
                    // Show deviation warning with confirm option
                    const confirmed = confirm(
                        '⚠️ Price Warning!\n\n' +
                        'Your entry: $' + d.entryPrice + '\n' +
                        'Live price: $' + Number(d.livePrice).toFixed(6) + '\n' +
                        'Deviation: ' + d.deviationPercent + '%\n\n' +
                        'This looks like a typo. Submit anyway?'
                    );
                    if (confirmed) submitTrade(forceSide, true);
                    return;
                }
                if (!r.ok) return showMsg(d.error || 'Error opening trade', true);
                showMsg('✅ ' + side + ' position opened for ' + symbol, false);
                ['f-symbol','f-entry','f-sl','f-tp','f-notes'].forEach(id => {
                    document.getElementById(id).value = '';
                });
                document.getElementById('f-price-hint').textContent = '';
                fetchData();
            } catch(e) { showMsg('Network error', true); }
        }

        async function closePosition(id, symbol) {
            if (!confirm('Close position for ' + symbol + ' at current price?')) return;
            try {
                const r = await fetch('/api/close-position/' + id, { method: 'DELETE' });
                const d = await r.json();
                if (!r.ok) return showMsg(d.error || 'Error closing position', true);
                showMsg('✅ Position closed for ' + symbol, false);
                fetchData();
            } catch(e) { showMsg('Network error', true); }
        }

        async function resetAccount() {
            if (!confirm('⚠️ Reset paper trading account to $1000?\n\nThis will close all positions and erase all trade history. This cannot be undone.')) return;
            try {
                const r = await fetch('/api/reset-paper-account', { method: 'POST' });
                const d = await r.json();
                if (!r.ok) return showMsg(d.error || 'Reset failed', true);
                showMsg('✅ Account reset to $1000', false);
                fetchData();
            } catch(e) { showMsg('Network error', true); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            setInterval(fetchData, 5000);
        });
    </script>
</body>
</html>
