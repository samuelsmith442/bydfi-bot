<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYDFi Trading Bot Dashboard</title>
    <link rel="stylesheet" href="/public/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 BYDFi Trading Bot</h1>
            <div class="status">
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span>Live Monitoring</span>
                </div>
                <div class="status-item">
                    <span id="mode">DAY Mode</span>
                </div>
                <div class="status-item">
                    <span id="last-update">Last update: --:--</span>
                </div>
            </div>
        </header>

        <div class="grid">
            <!-- Early Entry Signals -->
            <div class="card">
                <div class="card-title early">
                    ⚡ Early Entry Alerts
                    <span style="font-size: 0.8em; color: #94a3b8;">(Before +10%)</span>
                </div>
                <div id="early-signals" class="signals-list">
                    <div class="no-data">Waiting for signals...</div>
                </div>
            </div>

            <!-- Confirmed Signals -->
            <div class="card">
                <div class="card-title confirmed">
                    📊 Confirmed Opportunities
                    <span style="font-size: 0.8em; color: #94a3b8;">(Strong Moves)</span>
                </div>
                <div id="confirmed-signals" class="signals-list">
                    <div class="no-data">Waiting for signals...</div>
                </div>
            </div>
        </div>

        <div class="last-update">
            Dashboard auto-refreshes every 5 seconds. Check console for real-time updates.
        </div>
    </div>

    <script src="/public/dashboard.js"></script>
</body>
</html>
